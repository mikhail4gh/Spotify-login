                   <input type="email" style="background-color: black; width: 98%; padding-bottom: 20px; padding-top: 5px; border-radius: 5px;">
                   <button style="background-color: rgb(30 215 96); border-radius: 30px; width: 100%; padding-bottom: 15px; padding-top: 15px; font-weight: bolder; font-size: 15px; margin-top: 15px;">Continue</button> 
                </div>
        
              <p style="color: white;">or</p>

              <div style="display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 50px;">
                <p style="font-weight: bold; color: grey;">Don't have an account?</p>
                <button style="background-color: black; color: white; font-weight: bolder; border: none; font-size: 17px;">Sign up</button>
